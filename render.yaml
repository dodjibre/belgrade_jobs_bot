services:
  - type: worker
    name: belgrade-jobs-bot
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: GOOGLE_CREDS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
    pythonVersion: "3.11.6"
